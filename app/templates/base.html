<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Регистрация учетных записей{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Регистрация учетных записей</div>
    {% if user %}
    <nav>
      <a href="/">Журнал</a>
      <a href="/employees/new">Новый работник</a>
      <a href="/dismissals/new">Увольнение</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link-button" type="submit">Выйти: {{ user.username }}</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
